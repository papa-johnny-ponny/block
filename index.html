<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLOCK.</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLOCK.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#000;--surface:#161618;--surface-2:#252528;--line:#2e2e31;
  --text:#fff;--dim:#8a8a8f;--dim-2:#5e5e63;
  --accent:#e8393f;--accent-soft:#3a1214;--accent-text:#ff7a7e;--ok:#3ba55c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;width:100%}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
.hide{display:none!important}
header{background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;padding:14px 0 16px}
.brand h1{font-size:23px;letter-spacing:-.02em;font-weight:800;margin:0}
.pill{background:var(--accent-soft);color:var(--accent-text);font-size:13px;font-weight:600;padding:5px 13px;border-radius:999px}
.icon{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.back{color:var(--dim);font-size:16px;font-weight:600;padding:16px 0 4px;display:block}
.weekbar{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.weekbar b{font-size:19px;font-weight:700}
.weekbar button{width:38px;height:38px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:18px;color:var(--dim)}
.weekbar button[disabled]{opacity:.3}
.blocklbl{color:var(--dim);font-size:13px;margin:0 0 12px}
.segs{display:flex;gap:8px;margin-bottom:10px}
.seg{flex:1;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.seg i{display:block;height:100%;background:#fff;width:0;transition:width .4s}
.meta{color:var(--dim);font-size:14px;margin:0}
.dayrow{display:flex;gap:7px;margin:16px 0 4px}
.dayrow button{flex:1;height:46px;border-radius:13px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--dim)}
.dayrow button.on{background:#fff;color:#000}
.dayrow button.full{color:var(--ok)}
.rule{height:1px;background:var(--line);margin:18px 0 0}
main{padding-bottom:70px}
.eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.07em;margin:22px 0 4px}
.title{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px;line-height:1.06}
.sub{color:var(--dim);font-size:15px;margin:0 0 20px}
.card{display:flex;align-items:center;gap:15px;width:100%;background:var(--surface);border-radius:18px;padding:15px 17px;margin-bottom:11px}
.card:active{background:var(--surface-2)}
.ring{flex:0 0 auto;width:52px;height:52px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .bgc{stroke:#3a3a3d}.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .35s}
.ring.full .fg{stroke:var(--ok)}
.ring b{font-size:14px;font-weight:600;color:var(--dim);position:relative}
.ring.full b{color:#fff}
.cm{flex:1;min-width:0}
.cm h3{margin:0 0 3px;font-size:17px;font-weight:700;line-height:1.2}
.cm p{margin:0;color:var(--dim);font-size:13px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;padding:3px 7px;border-radius:6px;margin-bottom:5px}
.t-weighted{background:#2a2340;color:#a898f0}
.t-cal{background:#3a3016;color:#e0be6a}
.t-bodyweight{background:#12303c;color:#69bfdb}
.t-banded{background:#123027;color:#5ecfa0}
.t-cond{background:#3a2412;color:#e0a06a}
.t-skill{background:#3a1220;color:#e58098}
.t-plyo{background:#2c1a3c;color:#c48bec}
.t-rec{background:#123038;color:#66c4c4}
.t-carry{background:#2e2a18;color:#cfc07a}
.t-rotation{background:#301a2c;color:#d48ac0}
.t-power{background:#2c1a3c;color:#c48bec}
.t-aux{background:#26262a;color:#a0a0a8}
.t-animal{background:#1d2c1c;color:#8fc68a}
.chev{color:var(--dim-2);font-size:22px}
.grp{color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:24px 0 10px}
.note{background:var(--surface);border-radius:14px;padding:15px 17px;color:var(--dim);font-size:14px;margin:6px 0 16px}
.note b{color:var(--text);font-weight:600}
.big{display:block;width:100%;background:var(--surface);border-radius:20px;padding:20px;margin-bottom:12px}
.big h3{margin:0 0 5px;font-size:21px;font-weight:800;letter-spacing:-.02em}
.big p{margin:0;color:var(--dim);font-size:14px}
.big.primary{background:#fff;color:#000}.big.primary p{color:#444}
.foot{color:var(--dim-2);font-size:12px;line-height:1.5;margin:26px 0 0}
.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:var(--surface);
  border-radius:14px;padding:13px 16px;margin-bottom:8px}
.sec:active{background:var(--surface-2)}
.sec b{display:block;font-size:15px;font-weight:700}
.sec small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.tabs2{display:flex;gap:6px;overflow-x:auto;margin:2px -20px 16px;padding:0 20px;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--surface);color:var(--dim);font-size:14px;font-weight:600}
.tabs2 button.on{background:#fff;color:#000}
.info .pl{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.info .pl.q{color:var(--accent-text)}
.ptab{width:100%;border-collapse:collapse;margin:0 0 10px;font-size:14px}
.ptab th{text-align:left;color:var(--dim-2);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:0 8px 8px 0}
.ptab td{padding:10px 8px 10px 0;border-top:1px solid var(--line);color:#d6d6da;vertical-align:top}
.ptab td.kg{color:#fff;font-weight:700;white-space:nowrap}
.ptab td.w{color:var(--dim);width:32px}
.big.prog{display:flex;align-items:flex-start;padding:0}
.big.prog .pmain{flex:1;padding:20px;min-width:0}
.pinfo{flex:0 0 auto;width:34px;height:34px;border-radius:50%;margin:18px 16px 0 0;background:var(--surface-2);
  color:var(--dim);display:grid;place-items:center;font-size:15px;font-weight:700;font-style:italic;font-family:Georgia,serif}
.big.primary .pinfo{background:#e6e6ea;color:#000}
.titlerow{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.titlerow .title{margin:0}
.info{padding:6px 22px 4px}
.info h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.1}
.info .by{color:var(--dim);font-size:14px;margin:0 0 6px}
.info h4{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:24px 0 8px}
.info p{color:#d6d6da;font-size:15px;line-height:1.5;margin:0 0 10px}
.info ul{margin:0 0 10px;padding:0;list-style:none}
.info li{color:#d6d6da;font-size:15px;line-height:1.45;padding:9px 0;border-bottom:1px solid var(--line)}
.info li b{color:#fff;font-weight:600}
.info .pill2{display:inline-block;background:var(--surface-2);color:var(--dim);font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:999px;margin:0 6px 6px 0}
.srow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);gap:14px}
.srow b{font-weight:600;font-size:16px}
.srow span{color:var(--dim);font-size:14px}
.slist{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:15px 2px;border-bottom:1px solid var(--line)}
.slist .l{display:flex;flex-direction:column;gap:3px;min-width:0}
.slist .e{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim-2)}
.slist .e.now{color:var(--accent)}
.slist .t{font-size:15px}
.slist .r{font-size:11px;color:var(--dim-2);flex-shrink:0}
.slist .r.on{color:#fff}
.slist.done .t{color:var(--dim-2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#121214;border-radius:24px 24px 0 0;
  max-height:80vh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:999px;background:#48484c;margin:0 auto}
.sheethead{position:sticky;top:0;z-index:2;background:#121214;display:flex;align-items:center;justify-content:center;
  height:46px;border-radius:24px 24px 0 0;touch-action:none;cursor:grab}
.xbtn{position:absolute;right:14px;top:8px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);
  color:var(--dim);display:grid;place-items:center;font-size:20px;line-height:1}
.sheet.dragging{transition:none}
.vid{margin:16px 20px 0;border-radius:16px;background:var(--surface-2);padding:18px;text-align:center}
.embed{margin:16px 20px 0;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;position:relative}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.vlink{display:block;text-align:center;margin:10px 20px 0;color:var(--accent-text);font-size:14px;font-weight:600;text-decoration:none}
.vedit{margin:12px 20px 0;display:flex;gap:8px}
.vedit input{flex:1;font-size:14px;padding:11px 13px}
.vedit button{background:var(--surface-2);border-radius:12px;padding:11px 15px;font-size:14px;font-weight:600}
.vnote{display:block;text-align:center;color:var(--dim-2);font-size:12px;margin:9px 20px 0}
.lname{text-align:center;font-size:29px;font-weight:800;letter-spacing:-.03em;margin:18px 20px 6px;line-height:1.08}
.lmeta{text-align:center;color:var(--dim);font-size:15px;margin:0 20px 3px}
.lmeta b{color:#fff}
.desc{text-align:center;color:var(--dim);font-size:14px;font-style:italic;margin:10px 20px 0}
.est{text-align:center;color:var(--accent-text);font-size:13px;margin:8px 20px 0}
.load{text-align:center;margin:20px 0 2px}
.load .kg{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.load .kg small{font-size:22px;font-weight:600;color:var(--dim);margin-left:3px}
.load p{margin:6px 20px 0;color:var(--dim);font-size:14px}
.timer{display:flex;align-items:center;justify-content:center;gap:14px;margin:20px 0 4px}
.timer .t{font-variant-numeric:tabular-nums;font-size:32px;font-weight:700;min-width:92px;text-align:center}
.timer .t.hot{color:var(--accent)}
.btn-s{background:var(--surface-2);border-radius:999px;padding:11px 19px;font-size:15px;font-weight:600;text-align:center}
.sets{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 20px 4px}
.dot{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--dim-2)}
.dot.done{background:#fff;color:#000}
.dot.extra{background:var(--accent);color:#fff}
.acts{display:flex;gap:9px;justify-content:center;margin:16px 20px 0}
.acts .btn-s{flex:1}
.primary-btn{display:block;width:calc(100% - 40px);margin:16px 20px 0;background:#fff;color:#000;font-size:18px;font-weight:700;padding:18px;border-radius:17px;text-align:center}
.primary-btn.ghost{background:var(--surface-2);color:#fff}
.primary-btn:active{opacity:.75}
.warn{margin:14px 20px 0;background:var(--accent-soft);color:var(--accent-text);border-radius:13px;padding:13px 15px;font-size:13px}
.rmbox{margin:16px 20px 0;background:var(--surface);border-radius:16px;padding:17px}
.rmbox h4{margin:0 0 4px;font-size:16px;font-weight:700}
.rmbox p{margin:0 0 12px;color:var(--dim);font-size:14px}
.rmbox .row{display:flex;gap:8px;margin-bottom:8px}
.rmbox .row input{flex:1}
.toggle{display:flex;background:var(--surface-2);border-radius:13px;padding:4px;margin-bottom:12px}
.toggle button{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--dim);text-align:center}
.toggle button.on{background:var(--accent);color:#fff}
.calc{color:var(--dim);font-size:13px;margin:4px 0 0}.calc b{color:#fff}
.dens{margin:16px 20px 0;background:var(--surface);border-radius:16px;padding:17px}
.dens h4{margin:0 0 4px;font-size:16px;font-weight:700}
.dens p{margin:0 0 12px;color:var(--dim);font-size:14px}
.dens .row{display:flex;gap:8px;align-items:center}
.dens .row input{flex:1}
.dens .unit{color:var(--dim);font-size:14px;flex-shrink:0;min-width:52px}
.target{text-align:center;font-size:14px;margin:12px 20px 0;color:var(--dim)}
.target b{color:var(--accent-text)}
.hist{text-align:center;color:var(--dim-2);font-size:12px;margin:6px 20px 0}
.bigclock{text-align:center;margin:18px 0 2px}
.bigclock .t{font-variant-numeric:tabular-nums;font-size:62px;font-weight:800;letter-spacing:-.04em;line-height:1}
.bigclock .t.hot{color:var(--accent)}
.bigclock p{margin:4px 20px 0;color:var(--dim);font-size:13px}

/* ===== v5: calendar, overview, player, journal ===== */
select,textarea{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
textarea{min-height:84px;resize:vertical;font-size:15px;line-height:1.4}
select{-webkit-appearance:none;appearance:none;font-size:15px;margin-bottom:8px}
.btn-s.on{background:#fff;color:#000}
.btn-s[disabled]{opacity:.35}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.calhead b{font-size:15px;font-weight:700}
.calhead .ctl{display:flex;gap:6px}
.calhead button{background:var(--surface);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.cdh{text-align:center;color:var(--dim-2);font-size:10px;font-weight:700;letter-spacing:.08em}
.cd{height:54px;border-radius:13px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.cgrid.month .cd{height:42px}
.cd small{font-size:10px;color:var(--dim-2);font-weight:700;letter-spacing:.06em}
.cd b{font-size:15px;font-weight:700;color:var(--dim)}
.cd.today b{color:#fff}
.cd.sel{background:#fff}.cd.sel b,.cd.sel small{color:#000}
.cd.has::after{content:'';position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.cd.out{opacity:.35}
.dayp{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.dlab{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.cform{margin-top:12px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hrow span{color:var(--dim);min-width:0}
.hrow b{font-weight:600;text-align:right}
.dayp .hrow:last-of-type{border-bottom:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 10px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--surface);color:var(--dim);font-size:13px;font-weight:600}
.chips button.on{background:#fff;color:#000}
.ovstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ovstat{background:var(--surface);border-radius:14px;padding:13px 15px}
.ovstat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ovstat span{color:var(--dim);font-size:12px}
.ovstat small{color:var(--dim-2);font-size:12px;display:block;margin-top:2px}
.pbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);margin:8px 0 0}
.pbar span{width:92px;flex:0 0 auto}
.pbar i{flex:1;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.pbar i em{display:block;height:100%;background:#fff;border-radius:999px}
.pbar b{width:30px;text-align:right;color:#fff;font-weight:600;font-size:13px;display:inline}
.sb2{display:flex;align-items:center;gap:10px}
.sb2 button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px;color:var(--dim)}
.sb2 b{min-width:20px;text-align:center}
.prev{text-align:center;color:var(--dim);font-size:13px;margin:12px 20px 0}
.qlog{margin:16px 20px 0}
.qrow{display:flex;gap:8px}
.qrow label{flex:1;color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.qrow input{margin-top:5px;font-size:18px;font-weight:700;color:#fff}
.xsec{margin:20px 20px 0}
.xsec h4{color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:0 0 8px}
.rir{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.rir span{color:var(--dim);font-size:12px;margin-right:4px}
.rir button{min-width:40px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--dim);font-weight:700;font-size:14px;text-align:center}
.rir button.on{background:#fff;color:#000}
#v-play{padding-bottom:28px}
.ptop{display:flex;align-items:center;gap:12px;padding:12px 0 10px}
.ptop .pstat{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ptop .pstat span{color:var(--dim)}
.pbtn{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:17px;color:var(--dim);flex:0 0 auto;text-align:center}
.psegs{display:flex;gap:5px;margin-bottom:4px}
.psegs i{flex:1;height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.psegs i.cur{background:#4a4a4f}
.psegs i em{position:absolute;left:0;top:0;bottom:0;background:#fff}
#plBlock{font-size:28px}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:14px;margin-bottom:6px;background:var(--surface)}
.prow.on{background:#fff;color:#000}.prow.on small{color:#555}.prow.on .ck{border-color:#999}
.prow.done{opacity:.5}
.prow .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim-2);flex:0 0 auto;display:grid;place-items:center;font-size:12px;font-weight:700}
.prow.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.prow b{display:block;font-size:15px;font-weight:700;line-height:1.25}
#plRows.after{margin-top:18px}
#plRows.after::before{content:'In this block';display:block;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:0 0 10px}
.prow small{display:block;color:var(--dim);font-size:12px;margin-top:2px}

const blockFor=w=>BLOCKS.find(b=>w>=b.from&&w<=b.to);
function specFor(w,item){
  const B=blockFor(w),key=item.k||item.id;
  let s=item.s,p=item.p,nt=item.nt,off=false;
  for(let i=B.from+1;i<=Math.min(w,B.lastIn);i++){
    const o=B.ovr[i]&&B.ovr[i][key];
    if(o){if(o.s!=null)s=o.s;if(o.p!=null)p=o.p;if(o.nt!=null)nt=o.nt;if(o.off!=null)off=o.off;}
  }
  return {s,p,nt,off,confirmed:w<=B.lastIn,lastIn:B.lastIn};
}

               'legs','rest','rings','rest','legs','rest','rings','rest','legs','rest'];
  const bump={D3:1,D7:1,D13:1,D17:1};

  let ri=0,li=0,vi=0;
  return order.map((kind,idx)=>{

    if(kind==='rings')base=TPP_RINGS[ri++];

            hard:kind!=='rest',tag:kind==='rest'?(sprint[id]?'off · sprint ok':'off'):'lift',items};
  });
})();

 {id:'philosophy',n:'Philosophy',html:`
  <p style="margin-top:4px">This program combines structure, freedom and intention to help you build strength, move well and perform for life — without losing what makes training human.</p>
  <h4>Chop & Carry</h4>
  <p><i>Before enlightenment, chop wood, carry water. After enlightenment, chop wood, carry water.</i></p>
  <p>The Zen teaching behind the name emphasises:</p>
  <ul><li>The power of daily repetition</li><li>The humility of simple tasks</li>
   <li>That discipline and presence matter more than flashy outcomes</li>
   <li>That even after mastery, the foundations stay the same</li></ul>
  <h4>1 · Purpose</h4>
  <p>Built for efficiency, longevity and real-world performance. Not about being optimal on paper — about adapting training to your life so you stay consistent, get strong and feel capable every day. You train hard here so everyday life feels easier.</p>
  <h4>2 · Superset-driven and time-efficient</h4>
  <p>Exercises are ordered so muscle groups alternate or don't interfere, letting you superset naturally — pull-ups with lunges, dips with rows. Sessions flow, rest shrinks and conditioning comes without extra cardio.</p>
  <p>Gyms vary. If a pairing isn't practical, swap the movement for another that trains the same pattern. The program gives structure — you control the execution.</p>
  <h4>3 · Big movements first</h4>
  <p>High-carryover, multi-joint exercises that build strength, muscle, stability, coordination and athleticism at once. The one exception is session six, with towel isolation work for grip and forearms — a purposeful burnout "disco" finisher that's also fun.</p>
  <h4>4 · Low volume, high intent</h4>
  <p>Most exercises have two working sets. Volume stays under control, sessions stay short, and the mindset shifts: <i>I only have two sets — I'm going all in.</i></p>
  <p>Warm up as needed, then train with intent. Finish each set with 1–2 reps in reserve.</p>
  <h4>5 · Movement quality and longevity</h4>
  <p>Every pattern is trained — push, pull, hinge, squat, lunge, carry, rotation — to keep full-body capability. We reject "I used to be able to do that." Age isn't the problem, neglect is. Movement is a skill you keep by practising it.</p>
  <h4>6 · Adaptability and enjoyment</h4>
  <p>Not rigid. If you dislike or can't perform a movement, swap it for one in the same pattern or plane. Training should be challenging — and enjoyable.</p>
  <h4>7 · Cardio with purpose</h4>
  <p>Cardio fits best between lifting sessions: ideally one Zone 2 session and one high-intensity session, for heart health, recovery and mental well-being.</p>
  <p>If your strength sessions already bring plenty of conditioning and you'd rather only do Zone 2, that's fine. Zoom out. Big picture, not perfection.</p>
  <h4>8 · The core principle</h4>
  <p>Better to do something than nothing. Consistency beats intensity. Smart effort beats random effort. Stay consistent, apply progressive overload, and almost anything will work.</p>
  <p><b>Move with purpose. Stay human.</b></p>
  <h4>Preferred weekly split</h4>
  <p>The three main strength sessions anchor the week. Around them:</p>
  <ul><li><b>Other training and sports</b> — team sports, martial arts, mixed athletic work — on days that pair well with recovery.</li>
   <li><b>Conditioning</b> — Zone 2, intervals, running, cycling, rowing, sled pushes — placed so it supports strength work instead of interfering with it.</li>
   <li><b>Bodybuilding</b> — arms, shoulders, upper back — optional pump work on days that won't hurt recovery from the main sessions.</li></ul>`},
 {id:'longevity',n:'Longevity',html:`
  <h4 style="margin-top:4px">1 · Strength that lasts a lifetime</h4>
  <p>Not just muscle — staying capable, mobile and resilient. The real measure of fitness is whether your body can still do what life demands, at any age.</p>
  <h4>2 · Strength as a longevity biomarker</h4>
  <ul><li><b>Grip strength.</b> Every 5 kg drop is linked to 16 % higher mortality risk.</li>
   <li><b>Leg strength.</b> Weak legs in older adults carry up to 65 % higher risk of early death.</li>
   <li><b>Posterior chain.</b> Glutes, hamstrings and back protect against falls, injury and functional decline.</li></ul>
  <p>These markers are as reliable as blood pressure in predicting health and lifespan.</p>
  <h4>3 · Every session has a purpose</h4>
  <ul><li><b>Heavy days</b> — raw strength with low-rep compound lifts.</li>
   <li><b>Power, balance and endurance days</b> — athleticism and control.</li>
   <li><b>All movement planes</b> — push, pull, hinge, squat, lunge, rotate, carry.</li></ul>
  <h4>4 · Grease the groove</h4>
  <p>Dips and pull-ups are practised through the week with Pavel Tsatsouline's method:</p>
  <ul><li>Multiple mini-sets, three to five rounds</li><li>50 % or less of max reps</li><li>No fatigue, no failure — perfect reps only</li></ul>
  <p>It builds strength through neural adaptation, not exhaustion, and steadily raises your ceiling.</p>
  <h4>5 · Posterior chain and core</h4>
  <ul><li><b>Legs and posterior chain</b> — long-term mobility and power.</li>
   <li><b>Grip</b> — nervous system health and total body force.</li>
   <li><b>Core</b> — stability and force transfer.</li></ul>
  <h4>6 · Accessory work</h4>
  <p>Not fluff — the glue that holds performance together. Joint-friendly, multi-planar, functional. Carries, lunges, rotational work and loaded patterning reinforce what the heavy lifts build.</p>
  <h4>7 · Conditioning for health and power</h4>
  <ul><li><b>Zone 2</b> builds the heart, improves recovery and metabolism.</li>
   <li><b>Sprints and intervals</b> train power, speed and high-output energy systems.</li></ul>
  <p>One keeps you healthy. The other keeps you dangerous.</p>
  <h4>8 · In one line</h4>
  <p><b>Longevity isn't luck. It's architecture.</b></p>`},

const SF_BLOCK_NOTE=/^(= 1 round|\(X \d+ rounds\)|1-\/|\(30 reps for SF30\))$/i;
const SF_DAYS=SF_RAW.trim().split(/\n\s*\n/).map((chunk,i,all)=>{
  const [name,...lines]=chunk.split('\n').map(x=>x.trim()).filter(Boolean);
  const items=[];
  lines.forEach(line=>{
    const cut=line.indexOf(': ');
    const head=line.slice(0,cut),rows=line.slice(cut+2).split(' | ').map(x=>x.trim());
    const notes=rows.filter(r=>SF_BLOCK_NOTE.test(r)),work=rows.filter(r=>!SF_BLOCK_NOTE.test(r));
    items.push({grp:[head,...notes].join(' — ')});
    work.forEach(r=>items.push({n:r,s:''}));
  });
  return {key:name.toLowerCase(),eyebrow:`Session ${i+1} of ${all.length}`,n:name,hard:true,
          tag:`${lines.length} blocks`,items};
});

  </ul>`,
 week:`<h2 id="infoTitle">Rings &amp; Handstand Week</h2>

 tpp:`<h2 id="infoTitle">Push-Pull / Legs Rotation</h2>

  <span class="pill2">Timed</span><span class="pill2">Scored</span><span class="pill2">+1 % next time</span>
  <h4>What it is</h4>

   <li><b>20-16-12-8-4</b> — reps per movement, counting down each round.</li>
   <li><b>5X</b> — five reps. <b>(R) / (L)</b> — right and left. <b>25/25</b> — split per side.</li>
   <li><b>ABS5</b> — five minutes of core work.</li>
  </ul>

const UNITS={distance:'m',reps:'reps',rounds:'rounds',time:'sec',cal:'cal'};
const LOWER_BETTER={time:1};
const progById=id=>PROGRAMS.find(p=>p.id===id);

/* ===== state ===== */
const KEY='block.app.v4';
let S=null;
const blank=()=>({max:{},log:{},video:{},score:{},dens:{},prog:null,week:1,day:0,sess:null,sessions:[],sets:[],notes:{},swap:{},goal:3,mute:false});
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){S=blank();}
  S.max=S.max||{};S.log=S.log||{};S.video=S.video||{};S.score=S.score||{};S.dens=S.dens||{};
  S.week=S.week||1;S.day=S.day||0;
  S.sessions=S.sessions||[];S.sets=S.sets||[];S.notes=S.notes||{};S.swap=S.swap||{};S.goal=S.goal||3;}
/* a density block is either baked into the item or switched on by hand */
const densOf=(item,k)=>item.dens||S.dens[k]||null;
function target(hist,score){
  if(!hist||!hist.length)return null;
  const last=hist[hist.length-1];
  return LOWER_BETTER[score]?Math.max(1,Math.floor(last*0.99)):Math.ceil(last*1.01);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const epley=(w,r)=>w*(1+r/30);
const roundLoad=x=>Math.max(BAR,Math.floor(x/INCREMENT)*INCREMENT);
function loadFor(k,p){const m=S.max[k];return(!m||!m.value||p==null)?null:roundLoad(m.value*p/100);}
const weeksSince=iso=>iso?(Date.now()-new Date(iso).getTime())/6048e5:Infinity;

/* an item is {id} from EX, {n} plain, or {grp} heading */
function exOf(item){
  if(item.id){const e=EX[item.id]||{n:item.id,c:null};return{key:item.id,n:e.n,c:e.c,d:e.d,v:e.v};}
  return{key:'x:'+item.n,n:item.n,c:null,d:null,v:null};
}
const logKey=(prog,sess,i)=>`${prog}|${sess}|${i}`;
function entry(prog,sess,i){const k=logKey(prog,sess,i);
  if(!S.log[k])S.log[k]={sets:0,load:null,broke:false,done:false};return S.log[k];}

/* resolve a session (program + key) into a title and a visible item list */
function sessionOf(progId,sessKey){
  const P=progById(progId);
  if(P.shape==='weeks'){
    const m=sessKey.match(/^w(\d+)d(\d+)$/);const w=+m[1],d=+m[2],B=blockFor(w);
    const items=B.days[d].items.map((item,idx)=>({item,idx,sp:specFor(w,item)})).filter(x=>!x.sp.off);
    return{eyebrow:`Week ${w} · ${B.name}`,title:B.days[d].n,items};
  }
  const day=P.days.find(x=>x.key===sessKey);
  return{eyebrow:day.eyebrow,title:day.n,
    items:day.items.map((item,idx)=>({item,idx,sp:{s:item.s,p:item.p,nt:item.nt,grp:item.grp,confirmed:true}}))};
}
const realItems=list=>list.filter(x=>!x.item.grp);
function sessDone(progId,sessKey){
  const r=realItems(sessionOf(progId,sessKey).items);
  return r.length>0&&r.every(x=>entry(progId,sessKey,x.idx).done);
}
function sessCount(progId,sessKey){
  return realItems(sessionOf(progId,sessKey).items).filter(x=>entry(progId,sessKey,x.idx).done).length;
}
function progDone(P){
  if(P.shape==='weeks'){let n=0;for(let w=1;w<=TOTAL_WEEKS;w++)for(let d=0;d<7;d++)if(sessDone(P.id,`w${w}d${d}`))n++;return n;}
  return P.days.filter(d=>sessDone(P.id,d.key)).length;
}
const progTotal=P=>P.shape==='weeks'?TOTAL_WEEKS*7:P.days.length;

/* ===== scheme parsing ===== */
function parse(s){
  if(!s)return{sets:0,label:'Free logging'};
  let m=s.match(/^(\d+)\s*min$/i);
  if(m)return{sets:1,minutes:+m[1],label:`${m[1]} minutes`};
  m=s.match(/^(\d+)\s*[×x]\s*(\d+)$/);
  if(m)return{sets:+m[1],reps:+m[2],label:`${m[1]} sets × ${m[2]}`};
  m=s.match(/^(\d+)[–-](\d+)\s*min$/i);
  if(m)return{sets:1,minutes:+m[1],label:`${m[1]}–${m[2]} minutes`};
  m=s.match(/^(\d+)(?:[–-]\d+)?\s*[×x]\s*(.+)$/);
  if(m)return{sets:+m[1],label:`${s.split(/\s*[×x]\s*/)[0]} set${s.split(/\s*[×x]\s*/)[0]==='1'?'':'s'} × ${m[2].replace('F','to failure')}`};
  m=s.match(/^(\d+)D([\d-]+)$/i);
  if(m){const sets=+m[1],wv=m[2].split('-').map(Number);
    if(wv.length>1)return{sets,wave:wv,label:`${sets} sets · reps ${wv.join(', ')} in a wave`};
    return{sets,reps:wv[0],label:`${sets} sets × ${wv[0]} reps`};}
  m=s.match(/^(\d+)D$/i);
  if(m)return{sets:+m[1],label:`${m[1]} sets`};
  return{sets:0,label:s};
}

/* ===== views ===== */
function show(v){['home','program','session','library','settings','play','build'].forEach(x=>
  document.getElementById('v-'+x).classList.toggle('hide',x!==v));window.scrollTo(0,0);}
function ringHTML(done,total,size){
  const r=(size-6)/2,c=2*Math.PI*r,f=total?Math.min(done/total,1):0,full=total>0&&done>=total;
  return `<span class="ring ${full?'full':''}" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}"><circle class="bgc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="4"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="4" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}"/></svg>
    <b>${done}</b></span>`;
}

function renderHome(){
  const box=document.getElementById('progList');box.innerHTML='';
  PROGRAMS.forEach((P,i)=>{
    const w=document.createElement('div');w.className='big prog'+(i===0?' primary':'');
    w.innerHTML=`<button class="pmain"><h3>${P.n}</h3><p>${P.sub} · ${progDone(P)} of ${progTotal(P)} sessions done</p></button>
      <button class="pinfo" aria-label="About ${P.n}">i</button>`;
    w.querySelector('.pmain').onclick=()=>{S.prog=P.id;progTab='sessions';save();show('program');renderProgram();};
    w.querySelector('.pinfo').onclick=()=>openInfo(P.id);
    box.appendChild(w);
  });
  document.getElementById('libSub').textContent=`${Object.keys(EX).length} exercises`;
  const stale=Object.keys(S.max).filter(k=>weeksSince(S.max[k].date)>FRESH_WEEKS);
  const n=document.getElementById('homeNote');
  if(stale.length){n.classList.remove('hide');
    n.innerHTML=`<b>Time to retest.</b> ${stale.map(k=>(EX[k]||{n:k}).n).join(', ')} rests on numbers older than ${FRESH_WEEKS} weeks.`;}
  else n.classList.add('hide');
}

function renderProgram(){
  const P=progById(S.prog);
  document.getElementById('progTitle').textContent=P.n;
  document.getElementById('progSub').innerHTML=`${P.sub} · ${progDone(P)} of ${progTotal(P)} done`
    +(P.note?`<br><span style="color:var(--dim-2);font-size:13px">${P.note}</span>`:'');
  const dn=document.getElementById('denseNav'),dd=document.getElementById('denseDay'),sl=document.getElementById('sessionList');
  if(P.shape==='weeks'){dn.classList.remove('hide');dd.classList.remove('hide');sl.classList.add('hide');renderDense();}
  else{dn.classList.add('hide');dd.classList.add('hide');sl.classList.remove('hide');renderSessionList(P);}
  renderTabs(P);
  save();
}
let progTab='sessions';
function renderTabs(P){
  const bar=document.getElementById('progTabs'),tc=document.getElementById('tabContent'),sl=document.getElementById('sessionList');
  if(!P.tabs){bar.classList.add('hide');tc.classList.add('hide');return;}
  bar.classList.remove('hide');
  const all=[['sessions','Sessions'],...P.tabs.map(t=>[t.id,t.n])];
  bar.innerHTML=all.map(([id,n])=>`<button data-t="${id}" class="${id===progTab?'on':''}">${n}</button>`).join('');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{progTab=b.dataset.t;renderProgram();});
  if(progTab==='sessions'){tc.classList.add('hide');sl.classList.remove('hide');return;}
  const t=P.tabs.find(x=>x.id===progTab);
  tc.innerHTML=`<div class="info" style="padding:0">${typeof t.html==='function'?t.html():t.html}</div>`;
  tc.classList.remove('hide');sl.classList.add('hide');
}

function renderSessionList(P){
  const box=document.getElementById('sessionList');box.innerHTML='';
  const nextKey=(P.days.find(d=>!sessDone(P.id,d.key))||{}).key;
  P.days.forEach(d=>{
    const done=sessDone(P.id,d.key),cnt=sessCount(P.id,d.key);
    const total=realItems(sessionOf(P.id,d.key).items).length;
    const b=document.createElement('button');b.className='slist'+(done?' done':'');
    b.innerHTML=`<span class="l"><span class="e ${d.key===nextKey?'now':''}">${d.eyebrow}${d.key===nextKey?' · next':''}</span>
      <span class="t">${d.n}</span></span>
      <span class="r ${!done&&d.hard?'on':''}">${done?'done':(cnt?`${cnt}/${total}`:(d.tag||(d.hard?'hard':'easy')))}</span>`;
    b.onclick=()=>{S.sess=d.key;save();show('session');renderSession();};
    box.appendChild(b);
  });
}

function renderDense(){
  const w=S.week,d=S.day,B=blockFor(w);
  document.getElementById('wLabel').textContent=`Week ${w} of ${TOTAL_WEEKS}`;
  document.getElementById('wPrev').disabled=w<=1;
  document.getElementById('wNext').disabled=w>=TOTAL_WEEKS;
  document.getElementById('blockLbl').textContent=`${B.name} · weeks ${B.from}-${B.to}`;
  document.getElementById('segs').innerHTML=BLOCKS.map(b=>{
    let done=0,tot=(b.to-b.from+1)*7;
    for(let ww=b.from;ww<=b.to;ww++)for(let dd=0;dd<7;dd++)if(sessDone('dense12',`w${ww}d${dd}`))done++;
    return `<div class="seg" style="flex:${b.to-b.from+1}"><i style="width:${done/tot*100}%"></i></div>`;}).join('');
  const total=TOTAL_WEEKS*7;
  document.getElementById('pctLabel').textContent=`${Math.round(progDone(progById('dense12'))/total*100)} % of the program complete`;
  const dr=document.getElementById('dayrow');
  dr.innerHTML=DAY_SHORT.map((x,i)=>`<button data-d="${i}" class="${i===d?'on':(sessDone('dense12',`w${w}d${i}`)?'full':'')}">${x}</button>`).join('');
  dr.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;save();renderDense();});

  const sess=sessionOf('dense12',`w${w}d${d}`),key=`w${w}d${d}`;
  const list=realItems(sess.items);
  document.getElementById('dayEyebrow').textContent=sessDone('dense12',key)?'COMPLETE':`DAY ${d+1}`;
  document.getElementById('dayTitle').textContent=sess.title;
  document.getElementById('daySub').textContent=`${sessCount('dense12',key)} of ${list.length} logged · any order`;
  paintItems(document.getElementById('cards'),'dense12',key,sess.items);
  const wn=document.getElementById('weekNote');
  if(w>B.lastIn){wn.classList.remove('hide');
    wn.innerHTML=`<b>Week ${w} is not entered yet.</b> Everything shows from week ${B.lastIn} until the screenshots arrive.`;}
  else wn.classList.add('hide');
}

function renderSession(){
  const sess=sessionOf(S.prog,S.sess),list=realItems(sess.items);
  document.getElementById('sessEyebrow').textContent=sess.eyebrow.toUpperCase();
  document.getElementById('sessTitle').textContent=sess.title;
  document.getElementById('sessSub').textContent=`${sessCount(S.prog,S.sess)} of ${list.length} logged · any order`;
  paintItems(document.getElementById('sessCards'),S.prog,S.sess,sess.items);
}

function paintItems(box,prog,sessKey,items){
  box.innerHTML='';
  items.forEach(({item,idx,sp})=>{
    if(item.grp){const h=document.createElement('p');h.className='grp';h.textContent=item.grp;box.appendChild(h);return;}
    const ex=exFor(item,logKey(prog,sessKey,idx)),P=parse(sp.s),e=entry(prog,sessKey,idx),l=loadFor(ex.key,sp.p);
    const k=logKey(prog,sessKey,idx),D=densOf(item,k);
    const line=[];
    if(D){const h=S.score[k]||[],t=target(h,D.score);
      line.push(D.clock?`${D.clock} min · score in ${UNITS[D.score]}`:'for time');

function wireSheet(){
  const key=ctx.ex.key;
  document.querySelectorAll('.rmbox .toggle button').forEach(b=>b.onclick=()=>{rmMode=b.dataset.m;renderSheet();});
  const cW=document.getElementById('cW'),cR=document.getElementById('cR');
  if(cW){const upd=()=>{const o=document.getElementById('cOut');
      const w=parseFloat(cW.value),r=parseInt(cR.value,10);
      if(!w||!r){o.textContent='Enter a set you finished with good form.';return;}
      if(r>10){o.textContent='Above 10 reps the estimate runs optimistic. Test a heavier set instead.';return;}
      o.innerHTML=`Estimated 1RM: <b>${epley(w,r).toFixed(1)} kg</b>`;};
    cW.oninput=upd;cR.oninput=upd;upd();}
  const rs=document.getElementById('rmSave');
  if(rs)rs.onclick=()=>{
    if(rmMode==='known'){const v=parseFloat(document.getElementById('rmV').value);
      if(!(v>0)){alert('Enter a weight.');return;}
      S.max[key]={value:v,estimated:false,date:new Date().toISOString()};}
    else{const w=parseFloat(cW.value),r=parseInt(cR.value,10);
      if(!(w>0&&r>0&&r<=10)){alert('Enter weight and reps, 10 reps maximum.');return;}
      S.max[key]={value:+epley(w,r).toFixed(1),estimated:true,w,r,date:new Date().toISOString()};}
    save();renderSheet();};
  const lb=document.getElementById('logBtn');
  if(lb)lb.onclick=()=>{const {prog,sessKey,idx,sp}=ctx.c,P=parse(sp.s),e=entry(prog,sessKey,idx);
    if(P.sets===0){e.done=!e.done;e.sets=e.done?1:0;}
    else{e.sets++;e.load=loadFor(key,sp.p);if(e.sets>=P.sets)e.done=true;}
    save();renderSheet();if(P.sets>0)startClock();};
  const ub=document.getElementById('undo');
  if(ub)ub.onclick=()=>{const {prog,sessKey,idx,sp}=ctx.c,P=parse(sp.s),e=entry(prog,sessKey,idx);
    if(e.sets===0)return;e.sets--;if(e.sets<P.sets||P.sets===0)e.done=false;save();renderSheet();};
  const bb=document.getElementById('brk');
  if(bb)bb.onclick=()=>{const {prog,sessKey,idx}=ctx.c,e=entry(prog,sessKey,idx);e.broke=!e.broke;save();renderSheet();};
  const cb=document.getElementById('clockBtn');
  if(cb)cb.onclick=()=>{timer?stopClock():startClock();};
  const cr=document.getElementById('clockReset');
  if(cr)cr.onclick=()=>{stopClock();};
  const ss=document.getElementById('scSave');
  if(ss)ss.onclick=()=>{
    const {prog,sessKey,idx}=ctx.c,k=logKey(prog,sessKey,idx);
    const v=parseFloat(document.getElementById('scIn').value);
    if(!(v>0)){alert('Enter your total.');return;}
    S.score[k]=[...(S.score[k]||[]),v];
    const e=entry(prog,sessKey,idx);e.done=true;e.sets=1;
    stopClock();save();renderSheet();};
  const su=document.getElementById('scUndo');
  if(su)su.onclick=()=>{
    const {prog,sessKey,idx}=ctx.c,k=logKey(prog,sessKey,idx);
    const h=(S.score[k]||[]).slice(0,-1);
    if(h.length)S.score[k]=h;else{delete S.score[k];const e=entry(prog,sessKey,idx);e.done=false;e.sets=0;}
    save();renderSheet();};
  const dn=document.getElementById('densOn');
  if(dn)dn.onclick=()=>{
    const {prog,sessKey,idx}=ctx.c,k=logKey(prog,sessKey,idx);
    S.dens[k]={clock:10,score:'reps'};save();renderSheet();};
  paintClock();
}
function clockSpec(){
  if(!ctx||!ctx.c)return{secs:60,up:false,label:'Start the minute'};
  const {prog,sessKey,idx,item}=ctx.c,D=densOf(item||{},logKey(prog,sessKey,idx));
  if(!D)return{secs:60,up:false,label:'Start the minute'};
  return D.clock?{secs:D.clock*60,up:false,label:'Start'}:{secs:0,up:true,label:'Start'};
}
function startClock(){const s=clockSpec();stopClock();tLeft=s.secs;paintClock();
  timer=setInterval(()=>{tLeft+=s.up?1:-1;paintClock();
    if(!s.up&&tLeft<=0){stopClock();if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);}},1000);
  const b=document.getElementById('clockBtn');if(b)b.textContent='Stop';}
function stopClock(){const s=clockSpec();if(timer)clearInterval(timer);timer=null;tLeft=s.secs;paintClock();
  const b=document.getElementById('clockBtn');if(b)b.textContent=s.label;}
function paintClock(){const el=document.getElementById('clock');if(!el)return;
  el.textContent=`${Math.floor(Math.max(tLeft,0)/60)}:${String(Math.max(tLeft,0)%60).padStart(2,'0')}`;
  el.classList.toggle('hot',tLeft<=10&&!!timer);}

/* =====================================================================
   v5 · dated history, session player, journal, calendar, overview
   ===================================================================== */
const ymd=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const fmtT=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;};
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RIR_PROGS={chopcarry:1,dense12:1,sandbag:1};
const numVal=id=>{const el=document.getElementById(id);if(!el)return null;const v=parseFloat(String(el.value).replace(',','.'));return isFinite(v)&&v>0?v:null;};

/* ----- exercise identity (swap aware) ----- */
function exFor(item,k){const s=S.swap&&S.swap[k];
  if(s&&EX[s]&&item.id&&s!==item.id)return{...exOf({id:s}),from:exOf(item).n};
  return exOf(item);}

/* ----- sessions and set records ----- */
const liveSess=s=>!!(s.end||S.sets.some(r=>r.sid===s.id));
function findOpen(prog,key){const today=ymd(Date.now());
  return S.sessions.find(x=>x.prog===prog&&x.key===key&&!x.end&&!x.retro&&ymd(x.start)===today)||null;}
function openSession(prog,key){let s=findOpen(prog,key);
  if(!s){s={id:uid(),prog,key,start:Date.now(),end:null,note:''};S.sessions.push(s);}
  return s;}
const curSid=(prog,key)=>{const s=findOpen(prog,key);return s?s.id:null;};
/* removes a session and its sets; the tombstone keeps sync from bringing it back */
function deleteSession(id){(S._del=S._del||{})['sess|'+id]=Date.now();
  S.sessions=S.sessions.filter(s=>s.id!==id);S.sets=S.sets.filter(r=>r.sid!==id);save();renderHome();}
function recordSet(prog,key,idx,ex,data,sid){
  sid=sid||openSession(prog,key).id;
  S.sets.push({sid,t:Date.now(),prog,key,idx,ex:ex.key,name:ex.n,...data});save();}
function unrecordLast(prog,key,idx,sid){sid=sid||curSid(prog,key);if(!sid)return;
  for(let i=S.sets.length-1;i>=0;i--){const r=S.sets[i];
    if(r.sid===sid&&r.prog===prog&&r.key===key&&r.idx===idx){
      (S._del=S._del||{})[r.sid+'|'+r.t+'|'+r.idx]=Date.now();/* tombstone so sync does not bring it back */
      S.sets.splice(i,1);break;}}save();}
/* Previous = the most recent earlier session that logged this exercise */
function previousOf(exKey,sid){let last=null;
  for(let i=S.sets.length-1;i>=0;i--){const r=S.sets[i];if(r.ex===exKey&&r.sid!==sid&&!r.check){last=r.sid;break;}}
  return last?S.sets.filter(r=>r.sid===last&&r.ex===exKey&&!r.check):null;}
function historyOf(exKey){const by={};
  S.sets.forEach(r=>{if(r.ex===exKey&&!r.check)(by[r.sid]=by[r.sid]||[]).push(r);});
  return Object.values(by).sort((a,b)=>b[0].t-a[0].t);}
function setTxt(r){if(r.score!=null)return `${r.score} ${UNITS[r.unit]||''}`.trim();
  const a=[];if(r.kg)a.push(`${r.kg} kg`);if(r.reps)a.push(`${r.reps}`);
  let s=a.join(' × ')||'done';if(r.rir!=null)s+=` · ${r.rir>=3?'3+':r.rir} RIR`;return s;}
function prevLine(exKey,sid){const p=previousOf(exKey,sid);if(!p||!p.length)return '';
  return `Last time · ${fmtDate(p[0].t)} · ${p.map(setTxt).join(', ')}`;}
function defaultsFor(prog,key,x,n,sid){
  const k=logKey(prog,key,x.idx),ex=exFor(x.item,k),P=parse(x.sp.s);
  const pr=previousOf(ex.key,sid)||[],ps=pr.find(r=>r.set===n)||pr[pr.length-1]||null;
  return{reps:P.wave?P.wave[(n-1)%P.wave.length]:(P.reps||(ps&&ps.reps)||null),
    kg:loadFor(ex.key,x.sp.p)||(ps&&ps.kg)||null,prev:ps?setTxt(ps):''};}
function markAllDone(prog,key){

/* ===== audio, wake lock ===== */
let AC=null,WL=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d){if(S.mute||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.28,t);
  g.gain.exponentialRampToValueAtTime(.001,t+(d||.12));o.start(t);o.stop(t+(d||.12)+.02);}catch(e){}}
async function wakeOn(){try{if('wakeLock' in navigator)WL=await navigator.wakeLock.request('screen');}catch(e){}}
function wakeOff(){try{if(WL)WL.release();}catch(e){}WL=null;}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&PL&&!document.getElementById('v-play').classList.contains('hide'))wakeOn();});

/* ===== block protocols ===== */
function protoOf(b,prog,key){
  const nm=b.name||'';
  const iv=nm.match(/(?:^|[\s(–-])(\d{2})\/(\d{2})(?=[\s)]|$)/);
  const rounds=+((nm.match(/X\s*(\d+)\s*Round/i)||[])[1]||1);
  const mm=[...nm.matchAll(/(AMRAP|METCON|EMOM|LADDER|TABATA|ABS)\s*(\d+(?:\.\d+)?)/gi)];
  const m=mm.length?+mm[mm.length-1][2]:null;
  const D=b.items.map(x=>densOf(x.item,logKey(prog,key,x.idx))).find(Boolean);
  if(D)return{mode:'dens',D,label:D.clock?`${D.clock} min · score in ${UNITS[D.score]}`:'For time'};
  if(/tabata/i.test(nm)||iv){const w=iv?+iv[1]:20,r=iv?+iv[2]:10;
    return{mode:'interval',w,r,rounds,label:`${w} s on · ${r} s off · ${rounds} round${rounds>1?'s':''}`};}
  if(m){const ev=nm.match(/E(\d+)MOM/i),every=ev?+ev[1]:(/EMOM/i.test(nm)?1:0);
    return{mode:'clock',secs:Math.round(m*60),every,
      label:`${m} min${every?` · beep every ${every===1?'minute':every+' min'}`:''}`};}
  if(/^rest$/i.test(nm.trim())){const s=+((b.items.map(x=>x.item.n||'').join(' ').match(/(\d+)\s*sec/i)||[])[1]||60);
    return{mode:'clock',secs:s,every:0,label:`${s} s rest`};}
  const mi=b.items.length===1?parse(b.items[0].sp.s):null;
  if(mi&&mi.minutes)return{mode:'clock',secs:mi.minutes*60,every:0,label:/–/.test(mi.label)?`${mi.label.replace(' minutes',' min')} · clock set to ${mi.minutes}`:`${mi.minutes} min`};
  if(b.items.some(x=>parse(x.sp.s).sets>0))return{mode:'sets',label:'Sets · 60 s rest after each'};
  return{mode:'check',label:'Tick each row'};
}
function blocksOf(prog,key){const s=sessionOf(prog,key),out=[];let cur={name:'',items:[]};
  s.items.forEach(x=>{if(x.item.grp){if(cur.items.length)out.push(cur);cur={name:x.item.grp,items:[]};}else cur.items.push(x);});
  if(cur.items.length)out.push(cur);
  out.forEach(b=>{if(!b.name)b.name=s.title;b.pr=protoOf(b,prog,key);});
  return{title:s.title,eyebrow:s.eyebrow,blocks:out};}
function estMinutes(prog,key){let t=0,ok=false;
  blocksOf(prog,key).blocks.forEach(b=>{const p=b.pr;
    if(p.mode==='clock'){t+=p.secs;ok=true;}
    else if(p.mode==='interval'){t+=b.items.length*p.rounds*(p.w+p.r);ok=true;}
    else if(p.mode==='dens'&&p.D.clock){t+=p.D.clock*60;ok=true;}});
  return ok?Math.round(t/60):null;}

/* ===== clock ===== */
const clkNew=spec=>({...spec,acc:0,since:null,fired:-1,lastS:null});
const clkEl=c=>c.acc+(c.since?Date.now()-c.since:0);
const clkRun=c=>{if(!c.since)c.since=Date.now();};
const clkPause=c=>{if(c.since){c.acc+=Date.now()-c.since;c.since=null;}};
function clockFor(b){const p=b.pr;
  if(p.mode==='interval')return clkNew({type:'iv',w:p.w,r:p.r,rounds:p.rounds,rows:b.items.length,total:b.items.length*p.rounds*(p.w+p.r)*1000});
  if(p.mode==='clock')return clkNew({type:'down',total:p.secs*1000,every:p.every});
  if(p.mode==='dens')return p.D.clock?clkNew({type:'down',total:p.D.clock*60000,every:0}):clkNew({type:'up'});
  if(p.mode==='sets')return clkNew({type:'rest',total:60000});
  return clkNew({type:'up'});}

/* ===== player ===== */
let PL=null,plTimer=null;
const plE=x=>entry(PL.prog,PL.key,x.idx);
const plBlock=()=>PL.B.blocks[PL.bi];
function plFirstOpen(){const i=PL.B.blocks.findIndex(b=>b.items.some(x=>!plE(x).done));return i<0?0:i;}
function playOpen(prog,key){
  ensureAudio();wakeOn();
  const s=openSession(prog,key);save();
  PL={prog,key,sid:s.id,start:s.start,B:blocksOf(prog,key),bi:0,ii:0,clk:null,v:null,rir:null,ivRow:-1,from:document.getElementById('v-program').classList.contains('hide')?'session':'program'};
  plSetBlock(plFirstOpen());
  show('play');
  if(!plTimer)plTimer=setInterval(plTick,250);
}
function plSetBlock(i){PL.bi=Math.max(0,Math.min(i,PL.B.blocks.length-1));
  const b=plBlock(),j=b.items.findIndex(x=>!plE(x).done);
  PL.ii=j<0?0:j;PL.clk=clockFor(b);PL.v=null;PL.ivRow=-1;PL.finish=false;plRender();}
function plClose(){if(PL&&PL.clk)clkPause(PL.clk);wakeOff();const back=PL?PL.from:'program';PL=null;
  if(back==='session'){show('session');renderSession();}else{show('program');renderProgram();}}
function plPct(){const all=PL.B.blocks.flatMap(b=>b.items);
  return all.length?Math.round(all.filter(x=>plE(x).done).length/all.length*100):0;}
function plRec(x,data){const k=logKey(PL.prog,PL.key,x.idx);recordSet(PL.prog,PL.key,x.idx,exFor(x.item,k),data,PL.sid);}
function plUnrec(x){unrecordLast(PL.prog,PL.key,x.idx,PL.sid);}
function plTickRow(x,on){const e=plE(x),P=parse(x.sp.s);
  if(on&&!e.done){e.done=true;e.skip=false;if(P.sets>0)e.sets=Math.max(e.sets,P.sets);plRec(x,{check:true});}
  else if(!on&&e.done){e.done=false;e.skip=false;if(P.sets>0)e.sets=0;plUnrec(x);}save();}
function plBlockDone(){plBlock().items.forEach(x=>plTickRow(x,true));}

function plRender(){
  if(!PL)return;
  const b=plBlock(),p=b.pr,nb=PL.B.blocks.length;

    const f=bb.items.filter(x=>plE(x).done).length/bb.items.length;

  document.getElementById('plEyebrow').textContent=`${PL.B.eyebrow}${nb>1?` · part ${PL.bi+1} of ${nb}`:''}`.toUpperCase();

  /* log panel */

    const n=e.sets+1,d=defaultsFor(PL.prog,PL.key,x,Math.min(n,Math.max(P.sets,1)),PL.sid);

    if(d.prev&&P.sets>0)g+=`<p class="pprev">Last time · ${esc(d.prev)}</p>`;
    if(P.sets>0&&!e.skip){

        <button class="pgo" id="plLogSet">${e.sets>=P.sets?'Log an extra set':'Log set'}</button></div>`;
    }else if(!e.skip){
      g+=`<div class="pacts"><button class="pgo" id="plChk">${e.done?'Undo':'Mark done'}</button></div>`;
    }else g+=`<div class="pacts"><button class="pgo" id="plUnskip">Unskip</button></div>`;
    g+=`<button class="plink" id="plInfo">Video, notes &amp; history</button>`;
  }else if(p.mode==='dens'){
    const x=b.items.find(y=>densOf(y.item,logKey(PL.prog,PL.key,y.idx))),k=logKey(PL.prog,PL.key,x.idx);
    const D=densOf(x.item,k),hist=S.score[k]||[],t=target(hist,D.score),u=UNITS[D.score];
    g+=`<div class="pnow"><b>${esc(exFor(x.item,k).n)}</b><small>${hist.length?`Last ${hist[hist.length-1]} ${u}`:'No score yet — this one sets the baseline'}${t?` · target ${t} ${u}`:''}</small></div>
      <div class="qrow" style="margin-top:14px"><input id="plScore" type="number" inputmode="decimal" placeholder="Total in ${u}"></div>

const stepHTML=(id,lbl,v)=>`<input id="${id}" type="number" inputmode="decimal" value="${v==null?'':v}" aria-label="${lbl}">
  <div class="sb"><button data-s="${id}" data-d="-1" aria-label="Less">−</button><button data-s="${id}" data-d="1" aria-label="More">+</button></div><small>${lbl}</small>`;
function plRenderRows(){
  const b=plBlock(),p=b.pr,c=PL.clk;
  let act=-1;
  if(p.mode==='sets')act=PL.ii;
  else if(p.mode==='interval'&&c&&(c.since||c.acc)){const cyc=(c.w+c.r)*1000;act=Math.floor(Math.min(clkEl(c),c.total-1)/cyc)%c.rows;}
  document.getElementById('plRows').innerHTML=b.items.map((x,j)=>{
    const e=plE(x),P=parse(x.sp.s),k=logKey(PL.prog,PL.key,x.idx),ex=exFor(x.item,k);
    const meta=e.skip?'skipped':(P.sets>0?`${esc(P.label)}${e.sets?` · ${Math.min(e.sets,P.sets)}/${P.sets}`:''}`:(x.sp.s&&x.sp.s!==''?esc(P.label):''));
    return `<button class="prow ${j===act?'on':''} ${e.done?'done':''}" data-j="${j}"><span class="ck">${e.done?'✓':''}</span>
      <span style="flex:1;min-width:0"><b>${esc(ex.n)}</b>${meta?`<small>${meta}</small>`:''}</span></button>`;}).join('');
  document.querySelectorAll('#plRows .prow').forEach(r=>r.onclick=()=>{const j=+r.dataset.j,x=b.items[j];
    if(b.pr.mode==='sets'){PL.ii=j;PL.v=null;plRender();}
    else{plTickRow(x,!plE(x).done);plRender();}});
}
function plWire(){
  const b=plBlock(),q=id=>document.getElementById(id);
  document.querySelectorAll('#plStage .sb button').forEach(bt=>bt.onclick=()=>{
    const inp=q(bt.dataset.s),step=bt.dataset.s==='plKg'?2.5:1,v=parseFloat(inp.value)||0;
    inp.value=Math.max(0,+(v+step*+bt.dataset.d).toFixed(2))||'';
    PL.v[bt.dataset.s==='plKg'?'kg':'reps']=inp.value;});
  ['plKg','plReps'].forEach(id=>{const el=q(id);if(el)el.oninput=()=>{PL.v[id==='plKg'?'kg':'reps']=el.value;};});

  if(q('plLogSet'))q('plLogSet').onclick=()=>{ensureAudio();

    PL.clk=clockFor(b);clkRun(PL.clk);
    if(e.done){const nx=b.items.findIndex((y,j)=>j>PL.ii&&!plE(y).done);if(nx>=0)PL.ii=nx;}

  if(q('plUndo'))q('plUndo').onclick=()=>{const x=b.items[PL.ii],e=plE(x),P=parse(x.sp.s);
    if(!e.sets)return;e.sets--;if(e.sets<P.sets)e.done=false;plUnrec(x);save();plRender();};
  if(q('plChk'))q('plChk').onclick=()=>{const x=b.items[PL.ii];plTickRow(x,!plE(x).done);
    if(plE(x).done){const nx=b.items.findIndex((y,j)=>j>PL.ii&&!plE(y).done);if(nx>=0)PL.ii=nx;}plRender();};
  if(q('plUnskip'))q('plUnskip').onclick=()=>{const e=plE(b.items[PL.ii]);e.skip=false;e.done=false;save();plRender();};
  if(q('plInfo'))q('plInfo').onclick=()=>{const x=b.items[PL.ii],k=logKey(PL.prog,PL.key,x.idx);
    openSheet(exFor(x.item,k),{prog:PL.prog,sessKey:PL.key,idx:x.idx,sp:x.sp,item:x.item});};

  if(q('plBlockDone'))q('plBlockDone').onclick=()=>{

}
function plGo(d){
  if(d>0&&PL.bi===PL.B.blocks.length-1){plFinishView();return;}
  clkPause(PL.clk);plSetBlock(PL.bi+d);}
function plTick(){
  if(!PL||document.getElementById('v-play').classList.contains('hide'))return;
  document.getElementById('plTime').textContent=fmtT((Date.now()-PL.start)/1000);
  const c=PL.clk;if(!c||PL.finish)return;
  const el=clkEl(c);let big='',cap='',frac=0,rest=false,hot=false;
  if(c.type==='up'){big=fmtT(el/1000);cap=c.since?'Running':(el?'Paused':'Tap to start');frac=(el/1000%60)/60;}
  else if(c.type==='iv'){
    if(el>=c.total){if(c.since){clkPause(c);c.acc=c.total;beep(990,.6);if(navigator.vibrate)navigator.vibrate([300,100,300]);
      plBlockDone();plRender();return;}big='0';cap='Done';frac=1;}
    else{const cyc=(c.w+c.r)*1000,k=Math.floor(el/cyc),ph=el-k*cyc,work=ph<c.w*1000;
      const left=work?c.w*1000-ph:cyc-ph,s=Math.ceil(left/1000);
      big=String(s);rest=!work;frac=work?ph/(c.w*1000):(ph-c.w*1000)/(c.r*1000);
      cap=!c.since&&!el?'Tap to start':`${work?'Work':'Rest'} · round ${Math.floor(k/c.rows)+1}/${c.rounds}${c.since?'':' · paused'}`;
      const key=k*2+(work?0:1);
      if(c.since&&key!==c.fired){c.fired=key;beep(work?990:520,.2);c.lastS=null;}
      else if(c.since&&s<=3&&s!==c.lastS){c.lastS=s;beep(660,.07);}
      if(k%c.rows!==PL.ivRow){PL.ivRow=k%c.rows;plRenderRows();}}
  }else{
    const rem=c.total-el;
    if(rem<=0){if(c.since){clkPause(c);c.acc=c.total;beep(990,.6);if(navigator.vibrate)navigator.vibrate([300,100,300]);
      if(c.type==='down'&&plBlock().pr.mode==='clock'){plBlockDone();plRender();return;}}
      big='0:00';cap=c.type==='rest'?'Rest over':'Time';frac=1;}
    else{big=fmtT(Math.ceil(rem/1000));frac=el/c.total;hot=!!c.since&&rem<=10000;
      cap=c.type==='rest'?(c.since?'Rest':(el?'Paused':'Rest starts when you log a set')):(c.since?'Running':(el?'Paused':'Tap to start'));
      if(c.every&&c.since){const k=Math.floor(el/(c.every*60000));if(k>0&&k!==c.fired){c.fired=k;beep(880,.3);}}
      const s=Math.ceil(rem/1000);if(c.since&&s<=3&&s!==c.lastS){c.lastS=s;beep(660,.07);}}
  }
  document.getElementById('plBig').textContent=big;
  document.getElementById('plCap').textContent=cap;
  const ring=document.getElementById('plRing'),fg=ring.querySelector('.fg'),C=2*Math.PI*84;
  fg.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,frac)));
  ring.classList.toggle('rest',rest);ring.classList.toggle('hot',hot);
}

function jRender(){
  let h=`<h2 id="jTitle">Journal</h2><p class="by">${esc(PL.B.title)}</p>`;
  PL.B.blocks.forEach((b,bi)=>{h+=`<h4>${esc(b.name)}</h4>`;

      let dots='';

      else if(D){const h2=S.score[k]||[];dots=`<span class="jsc">${e.done&&h2.length?`${h2[h2.length-1]} ${UNITS[D.score]}`:'—'}</span>`;}
      else if(P.sets>0){for(let n=1;n<=Math.max(P.sets,e.sets);n++)dots+=`<button class="jd ${n<=e.sets?'done':''}" data-a="set" data-n="${n}">${n}</button>`;}
      else dots=`<button class="jd ${e.done?'done':''}" data-a="chk">✓</button>`;
      h+=`<div class="jrow" data-b="${bi}" data-i="${ii}"><button class="jname" data-a="go"><b>${esc(ex.n)}</b><small>${esc(P.label)}</small></button><div class="jdots">${dots}</div></div>`;});});
  document.getElementById('jBody').innerHTML=h;

    const row=bt.closest('.jrow'),bi=+row.dataset.b,ii=+row.dataset.i,x=PL.B.blocks[bi].items[ii],e=plE(x),P=parse(x.sp.s),a=bt.dataset.a;
    if(a==='go'){jClose();clkPause(PL.clk);plSetBlock(bi);PL.ii=ii;PL.v=null;plRender();return;}

      if(e.sets>=P.sets)e.done=true;}

/* ===== home: overview ===== */
let OVP=28;
const PERIODS=[[7,'7 days'],[14,'14 days'],[28,'28 days'],[90,'90 days'],['y','This year'],['all','Since start']];
const PATTERNS=[
  ['Hinge',/pull[\s-]?through|swing|deadlift|\brdl\b|hinge|clean|snatch|good morning|hyper|jefferson|hip thrust|high pull|kb overs/],
  ['Carry',/carry|farmer|suitcase/],
  ['Rotation',/twist|chop|rotat|grappler|windmill|turn|russian/],
  ['Squat · lunge',/squat|lunge|step[\s-]?up|cossack|thruster|zercher/],
  ['Pull',/\brows?\b|pull[\s-]?ups?\b|chin|face pull|curl|pulldown|muscle[\s-]?up/],
  ['Push',/press|push[\s-]?ups?|pushup|\bdips?\b|bench|handstand/]];
function patternOf(name){const n=(name||'').toLowerCase();for(const[p,re]of PATTERNS)if(re.test(n))return p;return null;}
function periodRange(p){const now=Date.now();
  if(p==='all')return[0,now,null];
  if(p==='y')return[new Date(new Date().getFullYear(),0,1).getTime(),now,null];
  const from=now-p*864e5;return[from,now,from-p*864e5];}
function streak(){const goal=S.goal||3,per={};
  S.sessions.filter(liveSess).forEach(s=>{const w=weekStart(s.start);per[w]=(per[w]||0)+1;});
  const cur=weekStart(Date.now()),thisW=per[cur]||0;let n=0,w=weekStart(cur-864e5);
  while((per[w]||0)>=goal){n++;w=weekStart(w-864e5);}
  if(thisW>=goal)n++;return{n,thisW,goal};}
function renderOverview(){
  const box=document.getElementById('homeOv'),[from,to,prevFrom]=periodRange(OVP);
  const inR=(t,a,b)=>t>=a&&t<=b;
  const ss=S.sessions.filter(s=>liveSess(s)&&inR(s.start,from,to));
  const ps=prevFrom!=null?S.sessions.filter(s=>liveSess(s)&&inR(s.start,prevFrom,from)).length:null;
  const recs=S.sets.filter(r=>inR(r.t,from,to));
  const sets=recs.filter(r=>!r.check&&r.score==null).length;
  const time=ss.reduce((a,s)=>a+durOf(s),0)/1000;
  const sc=recs.filter(r=>r.score!=null);
  const beat=sc.filter(r=>{const h=S.score[logKey(r.prog,r.key,r.idx)]||[],i=h.lastIndexOf(r.score);
    const prev=i>0?h[i-1]:null;return prev!=null&&(LOWER_BETTER[r.unit]?r.score<prev:r.score>prev);}).length;
  const pc={};PATTERNS.forEach(([p])=>pc[p]=0);
  recs.forEach(r=>{if(r.score!=null)return;const p=patternOf(r.name);if(p)pc[p]++;});
  const max=Math.max(1,...Object.values(pc)),st=streak();
  const delta=ps==null?'':(ss.length-ps===0?'same as before':`${ss.length-ps>0?'+':''}${ss.length-ps} vs previous ${OVP} days`);
  box.innerHTML=`<p class="grp" style="margin-top:6px">Overview</p>
    <div class="chips">${PERIODS.map(([v,l])=>`<button data-p="${v}" class="${String(v)===String(OVP)?'on':''}">${l}</button>`).join('')}</div>
    <div class="ovstats">
      <div class="ovstat"><b>${ss.length}</b><span>Sessions</span>${delta?`<small>${delta}</small>`:''}</div>
      <div class="ovstat"><b>${sets}</b><span>Sets logged</span></div>
      <div class="ovstat"><b>${fmtT(time).replace(/:\d\d$/,'')}${time>=3600?' h':' min'}</b><span>Training time</span></div>
      <div class="ovstat"><b>${sc.length}</b><span>Scores</span><small>${sc.length?`${beat} beat last time`:'density work'}</small></div></div>
    <div class="ovstat" style="margin-top:8px"><span>Load by pattern · sets and rows</span>
      ${Object.entries(pc).map(([p,n])=>`<div class="pbar"><span>${p}</span><i><em style="width:${n/max*100}%"></em></i><b>${n}</b></div>`).join('')}</div>
    <div class="ovstat" style="margin-top:8px;display:flex;justify-content:space-between;align-items:baseline">
      <span><b style="display:inline;font-size:20px">${st.n}</b> week${st.n===1?'':'s'} streak</span>
      <span>This week ${st.thisW} of ${st.goal}</span></div>`;
  box.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{const v=b.dataset.p;OVP=isNaN(+v)?v:+v;renderOverview();});
}

function parseHealth(txt){const out=[];

    const m=l.match(/([A-Za-zÅÄÖåäö][A-Za-zÅÄÖåäö ]*?)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/);if(!m)return;
    let k=m[1].trim().toLowerCase();k=HK_ALIAS[k]||k;
    let raw=m[2];if(k==='steps'&&/\d[.,]\d{3}$/.test(raw))raw=raw.replace(/[.,]/,'');
    const v=parseFloat(raw.replace(',','.'));if(isFinite(v))out.push({date,k,v});});

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;}

      const today=days[6][1],withData=days.filter(x=>x[1]>0),avg=withData.length?Math.round(withData.reduce((a,x)=>a+x[1],0)/withData.length):0,mx=Math.max(1,...days.map(x=>x[1]));

const pct1=x=>Math.round(x*10)/10;
function F(exId,rmKey,sets,note){
  const it={id:FMAP[exId]||exId},nts=[];
  if(!sets.every(x=>typeof x.s==='number')){
    const x=sets[0];it.s='';
    nts.push(x.s==='acc.'?`accumulate ${x.r}`:x.s==='self'?`${x.r}, self-paced`:`${x.s} sets × ${x.r}`);
    if(note)nts.push(note);it.nt=nts.join(' · ');return it;}
  const ps=[];
  sets.forEach(x=>{let r=String(x.r);if(r==='–')r=x.rpe==='AMRAP'?'AMRAP':'–';
    const p=x.load!=null&&rmKey?pct1(x.load/FBASE[rmKey]*100):null;
    for(let i=0;i<x.s;i++)ps.push({r,p,rpe:x.rpe==='AMRAP'?null:(x.rpe??null)});});
  const sameR=ps.every(q=>q.r===ps[0].r),sameP=ps.every(q=>q.p===ps[0].p),sameRpe=ps.every(q=>q.rpe===ps[0].rpe);
  it.s=`${ps.length} × ${sameR?ps[0].r:ps.map(q=>q.r).join(' / ')}`;
  if(ps.some(q=>q.p!=null))it.p=ps.filter(q=>q.p!=null).slice(-1)[0].p;
  if(!(sameR&&sameP&&sameRpe))it.ps=ps;
  if(ps.some(q=>q.rpe!=null))nts.push(sameRpe?`RPE ${ps[0].rpe}`:`RPE ${ps.map(q=>q.rpe??'–').join(' → ')}`);
  const rest=sets.find(x=>x.rest);if(rest)nts.push(`${rest.rest} rest`);
  if(note)nts.push(note);
  if(nts.length)it.nt=nts.join(' · ');
  return it;
}

INFO.fiveweek=`<h2 id="infoTitle">5-Week Strength</h2>
  <p class="by">Imported from FORGE · four weeks, a deload and a max-out</p>
  <span class="pill2">3 days a week</span><span class="pill2">Ramping sets</span><span class="pill2">AMRAP top set</span>
  <h4>What it is</h4>
  <p>Pull, push and legs. Each main lift ramps over three sets and the last one is as many reps as possible. Accessories run on effort — RPE 5 for the first set, close to failure on the second.</p>
  <h4>What to expect</h4>
  <ul><li><b>Weeks 1–4</b> climb in load on the main lifts and in effort on the accessories.</li>
   <li><b>Week 5</b> deloads to a few easy sets.</li>
   <li><b>Week 6</b> works up to new singles on squat, bench and deadlift.</li></ul>
  <h4>Two things to check</h4>
  <p><b>The loads came in as kilos, not percentages.</b> FORGE wrote them against assumed maxes of 160 kg deadlift, 120 kg bench, 120 kg squat and 65 kg overhead press. They are converted to percentages of those numbers, so they scale with your own max. Squat lands at 42–67 % — light. If it feels too easy, that is the source, not a bug.</p>
  <p><b>The overhead press max-out was broken.</b> Its loads ran up to 158 % of the assumed max, so they are left out. Work up to a new single by feel.</p>`;
INFO.ssforge=`<h2 id="infoTitle">Simple &amp; Sinister</h2>
  <p class="by">FORGE's variant · not Pavel's original</p>
  <span class="pill2">Daily kettlebell</span><span class="pill2">3 sessions</span>
  <h4>What it is</h4>
  <p>The kettlebell base — get-ups and swings five or six mornings a week — with three barbell sessions on top. Pavel's original is the morning practice only; the A, B and C sessions are FORGE's addition.</p>
  <h4>What to expect</h4>
  <ul><li><b>Morning, 15–20 minutes.</b> Ten get-ups, five per side, then swings building from 50 to 100 over twelve weeks.</li>
   <li><b>Sessions A, B, C.</b> Two working sets each. Deadlift, overhead press and bench run at 80–85 % of your max.</li></ul>`;
INFO.bbw=`<h2 id="infoTitle">BBW Level 3</h2>
  <p class="by">Bodyweight · eight weeks · three days</p>
  <span class="pill2">Pull-ups and dips</span><span class="pill2">Accumulation</span>
  <h4>What it is</h4>
  <p>Chin-ups and dips are accumulated: hit the total for the day across as many sets as you need, resting as long as you like. Pike push-ups, rows and core work round it out.</p>
  <h4>What to expect</h4>
  <ul><li><b>Weeks 1–4</b> accumulate 10–20 reps per movement.</li>
   <li><b>Weeks 5–8</b> raise that to 20–30 and add sets elsewhere.</li></ul>
  <p>Accumulated movements are ticked off when the total is done. Log sets on the rest as usual.</p>`;
INFO.hspro=`<h2 id="infoTitle">Handstand Pro</h2>
  <p class="by">Pressing strength toward the handstand push-up</p>
  <span class="pill2">Phase 1A</span><span class="pill2">Phase 1B</span><span class="pill2">3:00 rest</span>
  <h4>What it is</h4>
  <p>Twelve weeks of overhead pressing built around handstand push-up eccentrics. Phase 1A works back to the wall, phase 1B turns around to chest to wall and adds wall walks.</p>
  <h4>What to expect</h4>
  <ul><li><b>Long rests.</b> Three minutes between hard sets. Quality over volume.</li>
   <li><b>Sets climb</b> from two to four across each phase.</li>
   <li><b>Eccentrics first.</b> Lower slowly — the way down is the work.</li></ul>`;

  <h4>What it is</h4>
  <p>Two lower and two upper days. The main lifts are one set of as many reps as possible at a set percentage. Everything else is one set in a rep range at a target RPE.</p>
  <h4>What to expect</h4>
  <ul><li><b>Weeks 1–4</b> add about 4 % a week on the main lifts and push the accessories from RPE 8.5 to 10, with higher reps each week.</li>
   <li><b>Week 5</b> deloads to light sets of ten and RPE 5.</li></ul>
  <h4>Which max each lift uses</h4>
  <p>Squat, deadlift, bench and overhead press need a 1RM. Medium and close grip bench run off your bench, the stiff legged deadlift off your deadlift, and the behind-the-neck press off your overhead press. Box squat has its own max — 80–85 % of your squat works if you have not tested it.</p>
  <h4>Taken as written</h4>
  <p>Every exercise is a single set in the source. In week 2, seated abductions and the single arm row stay at 6–10 while the rest moves to 8–12.</p>`;

  if(box.innerHTML)(acts||body.lastChild).after(box);
  const sn=document.getElementById('ssNext');
  if(sn)sn.onclick=()=>{const nx=mem[(mem.findIndex(x=>x.idx===idx)+1)%mem.length];
    openSheet(exFor(nx.item,logKey(prog,sessKey,nx.idx)),{prog,sessKey,idx:nx.idx,sp:nx.sp,item:nx.item});};
  const so=document.getElementById('ssOut');
  if(so)so.onclick=()=>{const m=ssOf(prog,sessKey),g=m[idx];delete m[idx];
    const left=Object.keys(m).filter(i=>m[i]===g);if(left.length<2)left.forEach(i=>delete m[i]);save();renderSheet();};
  const si=document.getElementById('ssIn');
  if(si)si.onclick=()=>{const m=ssOf(prog,sessKey),g=m[idx]||m[nextX.idx]||uid();m[idx]=g;m[nextX.idx]=g;save();renderSheet();};
  if(item&&item.id){const eq=document.createElement('div');eq.className='xsec';
    eq.innerHTML=`<h4>Equipment</h4><select id="xEq"><option value="">As written</option>${EQUIP.map(v=>
      `<option ${S.eq[item.id]===v?'selected':''}>${v}</option>`).join('')}</select>`;
    const nt=document.getElementById('xNote');(nt?nt.closest('.xsec'):body.lastChild).before(eq);
    document.getElementById('xEq').onchange=ev=>{const v=ev.target.value;if(v)S.eq[item.id]=v;else delete S.eq[item.id];save();
      ctx.ex=exFor(item,k);renderSheet();};}
};

  const opts=[['','All'],...PATTERNS.map(([p])=>['p:'+p,p]),...muscles.map(m=>['m:'+m,m.charAt(0).toUpperCase()+m.slice(1)])];
  f.innerHTML=opts.map(([v,l])=>`<button data-v="${v}" class="${(LIBF||'')===v?'on':''}">${esc(l)}</button>`).join('');
  f.querySelectorAll('button').forEach(b=>b.onclick=()=>{LIBF=b.dataset.v||null;renderLibrary();});
  if(!LIBF)return;
  const byName={};Object.entries(EX).forEach(([id,e])=>byName[e.n]=id);
  const ok=id=>{const n=EX[id].n;return LIBF.startsWith('p:')?patternOf(n)===LIBF.slice(2):(MU[id]||[]).includes(LIBF.slice(2));};
  const list=document.getElementById('libList');let hdr=null,shown=0;
  [...list.children].forEach(el=>{

    const h=el.querySelector('h3'),id=h&&byName[h.textContent];const vis=!!id&&ok(id);el.classList.toggle('hide',!vis);if(vis)shown++;});
  if(hdr)hdr.classList.toggle('hide',!shown);};

/* ----- interval finisher ----- */
let FIN=null;
function finOpen(){ensureAudio();
  let o=document.getElementById('fin');
  if(!o){o=document.createElement('div');o.id='fin';document.body.append(o);}
  FIN={round:0,phase:'ready',left:20,t:null};finRender();o.classList.add('on');}
function finClose(){if(FIN&&FIN.t)clearInterval(FIN.t);FIN=null;const o=document.getElementById('fin');if(o)o.classList.remove('on');}
function finRender(){const o=document.getElementById('fin');if(!o||!FIN)return;
  const W=20,R=40,N=6;
  if(FIN.phase==='ready'){o.innerHTML=`<div class="wrap fin">
    <p class="eyebrow">FINISHER</p><h2 class="title">Interval finisher</h2>
    <p class="sub">Twenty seconds hard, forty easy, six rounds. Six minutes in total. Pick one thing and go all out on the work.</p>
    <button class="primary-btn" style="width:100%;margin:22px 0 0" id="finStart">Start</button>
    <button class="primary-btn ghost" style="width:100%;margin:10px 0 0" id="finSkip">Not today</button></div>`;
    document.getElementById('finStart').onclick=()=>{FIN.phase='work';FIN.left=W;beep(880,.2);
      FIN.t=setInterval(()=>{FIN.left--;
        if(FIN.left<=3&&FIN.left>0)beep(660,.08);
        if(FIN.left<=0){if(FIN.phase==='work'){FIN.phase='rest';FIN.left=R;beep(440,.25);}
          else if(FIN.round>=N-1){clearInterval(FIN.t);FIN.phase='done';beep(990,.3);}
          else{FIN.round++;FIN.phase='work';FIN.left=W;beep(880,.2);}}
        finRender();},1000);finRender();};
    document.getElementById('finSkip').onclick=finClose;return;}
  if(FIN.phase==='done'){o.innerHTML=`<div class="wrap fin"><p class="eyebrow">DONE</p><h2 class="title">Six rounds.</h2>
    <p class="sub">That's the session finished.</p>
    <button class="primary-btn" style="width:100%;margin:22px 0 0" id="finEnd">Close</button></div>`;
    document.getElementById('finEnd').onclick=finClose;return;}
  const tot=FIN.phase==='work'?W:R,rr=82,cc=2*Math.PI*rr,f=FIN.left/tot;
  o.innerHTML=`<div class="wrap fin"><p class="eyebrow">ROUND ${FIN.round+1} OF ${N}</p>
    <div class="fring ${FIN.phase}"><svg viewBox="0 0 184 184"><circle cx="92" cy="92" r="${rr}" fill="none" stroke="#2a2a2d" stroke-width="6"/>
      <circle cx="92" cy="92" r="${rr}" fill="none" stroke="${FIN.phase==='work'?'#fff':'#6b6b72'}" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${cc}" stroke-dashoffset="${cc*(1-f)}" style="transition:stroke-dashoffset .9s linear"/></svg>
      <div><b>${FIN.left}</b><span>${FIN.phase==='work'?'Work':'Rest'}</span></div></div>
    <div class="fdots">${Array.from({length:N},(_,i)=>`<i class="${i<FIN.round?'d':i===FIN.round?'c':''}"></i>`).join('')}</div>
    <button class="primary-btn ghost" style="width:100%;margin:26px 0 0" id="finStop">Stop</button></div>`;
  document.getElementById('finStop').onclick=finClose;}
